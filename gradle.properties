# Titan — Gradle properties.

# ── Project version ───────────────────────────────────────────────────────────
# Canonical version pin for the Titan reactor. The k3s Helm chart at
# rig/k3s/helm/titan/Chart.yaml is bumped in lockstep with this value. The
# release flow (docs/RELEASING.md) tags the commit that bumps these two.
version=1.0.0-rc1

# Titan — Gradle performance defaults (FAANG-grade).
#
# These flags are ON by default so every developer + CI invocation gets the
# same cached, parallel, configuration-cached build without having to remember
# command-line flags. The numbers in the PR that introduced this file are:
#
#   cold (no cache):              ~4m
#   warm + build cache + config:  ~5s
#
# Any value here can be overridden per-invocation with -P or -D flags.

# ── Parallelism ───────────────────────────────────────────────────────────────
# Run independent project tasks in parallel. Safe with --configure-on-demand
# below because the module graph is well-defined in settings.gradle.kts.
org.gradle.parallel=true

# Only configure the projects involved in the requested task graph. With ~10
# modules and counting, this skips configuration work for modules you aren't
# touching this invocation.
org.gradle.configureondemand=true

# Use as many worker threads as we have cores. Set explicitly so CI containers
# with a low core count override via -Dorg.gradle.workers.max=N.
org.gradle.workers.max=8

# ── Caching ───────────────────────────────────────────────────────────────────
# Local build cache ON by default. Outputs of cacheable tasks (compileJava,
# test, jar, ...) are reused across runs, branches, and clean checkouts as long
# as the inputs hash matches. The cache directory defaults to
# ~/.gradle/caches/build-cache-1 — a remote backend is wired in
# settings.gradle.kts as a stub for the eventual S3/Develocity remote cache.
org.gradle.caching=true

# Configuration cache — kept OFF by default until the convention plugin's
# Test-task `classpath` assignment is reworked (see issue #NNN). Enable
# per-invocation with --configuration-cache once that lands; expected savings
# are an extra 1-3s on warm runs on top of what build cache + daemon already
# give us.
# org.gradle.configuration-cache=true
# org.gradle.configuration-cache.problems=warn

# ── Daemon + JVM ──────────────────────────────────────────────────────────────
# The daemon stays alive between invocations to keep classes JIT'd and caches
# hot. 4 GB heap is the sweet spot for a project of this size (Quarkus
# augmentation, JDBI SqlObject bytecode generation, and large test classpaths
# combined push 2.5 GB at peak).
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC

# ── File system watcher ───────────────────────────────────────────────────────
# Use VFS so Gradle skips stat()ing every input file on every invocation.
org.gradle.vfs.watch=true
