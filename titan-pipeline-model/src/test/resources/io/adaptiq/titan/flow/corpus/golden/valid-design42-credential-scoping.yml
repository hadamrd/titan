# GOLDEN — design/42 §2's three-level credential scoping (pipeline / stage /
# step). Authored to the canonical `stage:` discriminator (the design snippet's
# `name:` is prose shorthand; the grammar key is `stage:`). All credential types
# and binding-variable keys exercised.
credentials:
  - id: artifactory
    type: usernamePassword
    usernameVariable: ART_USR
    passwordVariable: ART_PSW
stages:
  - stage: deploy
    credentials:
      - id: deploy-key
        type: sshKey
        keyFileVariable: DEPLOY_KEY
        passphraseVariable: DEPLOY_PASS
    steps:
      - sh: ./deploy.sh
        credentials:
          - id: one-off-token
            type: string
            variable: TOKEN
