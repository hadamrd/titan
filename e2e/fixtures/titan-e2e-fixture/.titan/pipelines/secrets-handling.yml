# Adversarial secrets-handling fixture — e2e spec 45 (CONSTITUTION §6).
#
# Drives Titan's declarative `credentials:` binding (design/39 + design/42)
# end-to-end and proves the engine never leaks the bound plaintext into any
# observable channel. Two stages:
#
#   1. Consume    — binds the STRING credential `e2e-secrets/__KEY__` into the
#                   step env as $SECRET_TOKEN and proves consumption by printing
#                   only its LENGTH (`consume ok: len=<n>`), never the value.
#   2. LeakAttempt— deliberately writes $SECRET_TOKEN to leaked.txt and archives
#                   it. This is the adversarial probe: the engine SHOULD mask the
#                   value in the log stream (CredentialResolver maskValues) and
#                   the spec asserts the plaintext never reaches the persisted
#                   pipelineScript, the SSE log stream, or the archived artifact.
#
# `__KEY__` is a placeholder: the e2e spec rewrites it to a per-run credential
# key (token-<RUN_TAG>) so concurrent runs do not collide on the credentials
# store (scope, key) uniqueness constraint. The model carries the credential id
# only — the secret is resolved + masked on the controller at dispatch and is
# never persisted in pipeline_model_json.
#
# Plain `sh` steps (no `image:`) run directly on the bare-JRE worker, exactly
# like the simple-build fixture — no container pull, deterministic + fast.
agent: linux

stages:
  - stage: Consume
    credentials:
      - id: e2e-secrets/__KEY__
        type: string
        variable: SECRET_TOKEN
    steps:
      # Prove the binding resolved by printing the LENGTH, never the value.
      - sh: 'echo "consume ok: len=${#SECRET_TOKEN}"'

  - stage: LeakAttempt
    dependsOn: [Consume]
    credentials:
      - id: e2e-secrets/__KEY__
        type: string
        variable: SECRET_TOKEN
    steps:
      # Adversarial: write the bound secret to a file and archive it. The engine
      # masks the LOG stream; the spec checks whether the plaintext also survives
      # into the archived file (assertion D — if it does, that is a real engine
      # bug to file, not something this fixture should hide).
      - sh: 'printf "%s" "$SECRET_TOKEN" > leaked.txt'
      - archiveArtifacts:
          artifacts: "leaked.txt"
