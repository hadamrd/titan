# Fixture pipeline for issue #1130 — the SRE's day-zero failure-triage flow.
#
# Shape:
#   install -> unit-test (FAILS by design) -> build (SKIPPED on failure)
#
# Invariants the e2e spec asserts:
#   * build terminates as FAILURE within 30s (configurable timeout).
#   * the failing step is `unit-test`.
#   * its log output contains a line matching /FAIL /.
#   * after the spec patches the failing test to passing and re-triggers,
#     the build terminates as SUCCESS.

# Source location + isolation (#157): the local rig bind-mounts the repo's
# e2e/pipelines/ READ-ONLY at /titan/fixtures inside the worker
# (rig/local/docker-compose.yml). Steps start in the build's OWN workspace
# (/titan/worker/build-<id> — design/43 build-scoped workspaces), so the
# install stage copies the fixture source INTO that workspace and every later
# stage runs there — real CI checkout semantics. Running npm in the shared
# mount (the pre-#157 design) let two concurrent builds of this fixture race
# on one node_modules: one build's `npm ci` wiped node_modules mid-vitest of
# the other, vitest found zero tests, exited 0, and a should-fail build went
# PHANTOM SUCCESS.
#
# HOST SOURCE IS IMMUTABLE AT RUN TIME (#161). The second phantom-SUCCESS
# mechanism (post-#158) was NOT a copy failure: the triage spec's leg 4 used
# to patch src/sum.test.js to passing ON THE HOST, trigger, and restore ~20s
# later. The :ro mount does not protect against that — host edits pass
# straight through the bind mount — so any CONCURRENT spec (golden-path
# surface A, TITAN_PW_WORKERS=2) whose install tar-copied inside that window
# got the passing source and its should-fail build went SUCCESS (observed
# live: builds 3110 FAILED / 3111 patched-SUCCESS / 3112 phantom-SUCCESS,
# 2026-07-10 06:57 UTC). Leg 4 now patches BUILD-SCOPED instead: it rewrites
# the job's pipelineScript (PATCH /api/v1/jobs/{id}) at the E2E_PATCH_POINT
# anchor below, so the sed runs inside the build's own workspace copy. NOBODY
# may mutate e2e/pipelines/** while a rig is up — specs patch via the anchor.
#
# Warm-run speed: node_modules can no longer persist in the (read-only)
# fixture dir, so the shared npm CACHE at /titan/npm-cache (titan-ws volume —
# cache dir, NOT workspace; survives container recreation, unlike the
# pre-#157 /root/.npm) is what keeps installs fast (~3s warm, measured). The
# rig-smoke pre-warm job (dev/rig-smoke/prewarm-worker.sh, #84/#153) warms
# exactly that cache.
agent: linux

env:
  NODE_ENV: test
  CI: "true"
  # Shared npm cache on the titan-ws volume (#157) — cache dir ≠ workspace:
  # npm's content-addressed cacache tolerates concurrent readers/writers,
  # unlike a shared node_modules.
  npm_config_cache: /titan/npm-cache

stages:
  - stage: install
    steps:
      # Copy-into-workspace-then-run (#157). tar --exclude skips any
      # node_modules/dist a developer's local sanity run (README) left in the
      # checked-out fixture dir; the workspace install below is the only
      # node_modules this build ever sees.
      - sh: |
          set -e
          tar -C /titan/fixtures/node-app-with-failing-test --exclude=./node_modules --exclude=./dist -cf - . | tar -xf -
          true # E2E_PATCH_POINT (#161): specs rewrite this single line via PATCH /api/v1/jobs/{id} to patch the WORKSPACE copy (never the host fixture)
          npm ci --prefer-offline --no-audit --no-fund || npm install --prefer-offline --no-audit --no-fund --no-package-lock

  - stage: unit-test
    dependsOn: [install]
    steps:
      # vitest exits 1 when any test fails; the engine maps that to FAILURE.
      # The worker captures stdout/stderr verbatim — vitest's "FAIL " prefix
      # is what the UI log viewer scrolls to on click.
      # cwd is the workspace the install stage populated (design/43: all
      # stages of one build share /titan/worker/build-<id>).
      #
      # Structural guards (#161): this fixture's oracle depends on the suite
      # EXECUTING, so it must be INCAPABLE of succeeding via test-absence:
      #   * test -f fails the step loudly if the workspace copy lost the file
      #     (tar failure, cwd drift, partial copy — whatever the mechanism).
      #   * --passWithNoTests=false pins vitest's fail-on-zero-tests default
      #     (verified on vitest 2.1.9: absent OR empty test file exits 1;
      #     `=false` parses — the bare flag flips exit to 0, `=false` keeps 1).
      - sh: |
          set -e
          test -f src/sum.test.js || { echo "GUARD(#161): src/sum.test.js missing from workspace copy — failing loud, never pass-by-absence"; exit 1; }
          npx vitest run --reporter=default --passWithNoTests=false

  - stage: build
    dependsOn: [unit-test]
    # Only runs if unit-test passed — proves the failure short-circuited
    # downstream work (the SRE story: "don't deploy a red build").
    #
    # NOTE (issue #36): expressed via `dependsOn` alone — the engine's default
    # blockOnFailure policy already SKIPs the descendants of a failed stage.
    # A stage-level `when:` is evaluated at BAKE time (before any step has
    # run) against `params.*` only, so the previous
    # `when: "steps.unit-test.result == 'success'"` was a configuration error
    # the engine now rejects with a precise message instead of the opaque
    # "Transaction failed" abort.
    steps:
      - sh: npm run build
