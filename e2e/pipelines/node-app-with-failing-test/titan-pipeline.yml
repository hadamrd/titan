# Fixture pipeline for issue #1130 — the SRE's day-zero failure-triage flow.
#
# Shape:
#   install -> unit-test (FAILS by design) -> build (SKIPPED on failure)
#
# Invariants the e2e spec asserts:
#   * build terminates as FAILURE within 30s (configurable timeout).
#   * the failing step is `unit-test`.
#   * its log output contains a line matching /FAIL /.
#   * after the spec patches the failing test to passing and re-triggers,
#     the build terminates as SUCCESS.

# Source location: the local rig bind-mounts the repo's e2e/pipelines/ at
# /titan/fixtures inside the worker (rig/local/docker-compose.yml). Steps cd
# into the mounted dir — node_modules persists there across builds, so the
# `npm install` fallback is a fast no-op after the first run, and the triage
# spec's patch-source-then-retrigger leg (#1130 test 4) sees host edits live.
agent: linux

env:
  NODE_ENV: test
  CI: "true"

stages:
  - stage: install
    steps:
      - sh: cd /titan/fixtures/node-app-with-failing-test && npm ci --no-audit --no-fund || npm install --no-audit --no-fund --no-package-lock

  - stage: unit-test
    dependsOn: [install]
    steps:
      # vitest exits 1 when any test fails; the engine maps that to FAILURE.
      # The worker captures stdout/stderr verbatim — vitest's "FAIL " prefix
      # is what the UI log viewer scrolls to on click.
      - sh: cd /titan/fixtures/node-app-with-failing-test && npx vitest run --reporter=default

  - stage: build
    dependsOn: [unit-test]
    # Only runs if unit-test passed — proves the failure short-circuited
    # downstream work (the SRE story: "don't deploy a red build").
    #
    # NOTE (issue #36): expressed via `dependsOn` alone — the engine's default
    # blockOnFailure policy already SKIPs the descendants of a failed stage.
    # A stage-level `when:` is evaluated at BAKE time (before any step has
    # run) against `params.*` only, so the previous
    # `when: "steps.unit-test.result == 'success'"` was a configuration error
    # the engine now rejects with a precise message instead of the opaque
    # "Transaction failed" abort.
    steps:
      - sh: cd /titan/fixtures/node-app-with-failing-test && npm run build
