# credentials — a bound secret is masked **** in the log (design/39 §4).
#
# PORTED to the standalone rig + RETIRED to `pending` (#1175).
#
# This fixture was from the legacy plugin-host era: its `setup:` was a Groovy
# credential-store preamble run on the legacy script console. Phase 3 deleted
# the legacy plugin host (docs/design/58-phase3-deletion-completed.md), so that
# preamble is dead — it would NPE on the standalone rig. It has been removed.
#
# This scenario stays `pending` because the generic scenario runner
# (scenarios.spec.ts) cannot SEED a credential on the standalone rig — the
# standalone secret-seed surface is `POST /api/v1/credentials` (Keycloak-authed),
# which the YAML-only runner has no hook for. The build-detail-UI port that DOES
# seed (via that REST surface) and asserts masking lives at
# e2e/specs/golden-path-secret-redaction.spec.ts and is the live home of this
# coverage.
#
# Rig fixture note: a sealed-credential step needs the AES-256 key
# `TITAN_CREDENTIAL_KEY` configured byte-identical on the controller AND every
# worker (design/39 §3.1). The shared compose stack sets it on both services.
#
# Kept (not deleted) as a discoverable, standalone-era tombstone: the generic
# runner registers it as a visible skipped test with the gap spelled out.
name: credentials — bound secret masked in the log
pending: |
  Superseded by e2e/specs/golden-path-secret-redaction.spec.ts (v3 build-detail
  UI). The generic runner has no standalone secret-seed hook
  (POST /api/v1/credentials). Legacy plugin-host Groovy setup removed per Phase 3.
pipeline: |
  agent: titan-worker-1
  stages:
    - stage: build
      steps:
        - sh: echo "using token [$E2E_TOKEN]"
          credentials:
            - id: e2e-token
              type: string
              variable: E2E_TOKEN
expect:
  build: SUCCESS
  nodes:
    build: { status: SUCCESS }
  logContains:
    - '****'
  logExcludes:
    - SUPER-SECRET-E2E-VALUE-91
