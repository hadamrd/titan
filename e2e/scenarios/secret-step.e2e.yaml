# secret-step — env-bound secret never appears in the log.
#
# PORTED to the standalone rig + RETIRED to `pending` (#1175).
#
# This fixture was from the legacy plugin-host era: its `setup:` was a Groovy
# SystemCredentialsProvider / StringCredentialsImpl preamble run on the legacy
# script console. Phase 3 deleted the legacy plugin host (docs/design/58-phase3-
# deletion-completed.md), so that preamble is dead — it would NPE on the standalone rig.
# It has been removed and the pipeline ported to standalone PDL shape (an
# `env: ${{ secrets.<id> }}` binding instead of a step-local `credentials:`
# block).
#
# This scenario stays `pending` for TWO independent reasons:
#   1. #1094 — the `env: X: ${{ secrets.<id> }}` runtime is unshipped (the
#      expression is parsed but not resolved + masked at step dispatch).
#   2. The generic scenario runner (scenarios.spec.ts) cannot SEED a credential
#      on the standalone rig — the standalone secret-seed surface is
#      `POST /api/v1/credentials` (Keycloak-authed), which the YAML-only runner
#      has no hook for. The build-detail-UI port that DOES seed (via that REST
#      surface) lives at e2e/specs/golden-path-secret-redaction.spec.ts and is
#      the live home of this coverage.
#
# Kept (not deleted) as a discoverable, standalone-era tombstone: the generic
# runner registers it as a visible skipped test with the gap spelled out, and a
# grep for "secret" in scenarios/ lands on the pointer to the live UI spec.
name: secret-step — env-bound secret never appears in the log
pending: |
  Superseded by e2e/specs/golden-path-secret-redaction.spec.ts (v3 build-detail
  UI). Blocked here by #1094 (env+secret runtime) AND the generic runner having
  no standalone secret-seed hook (POST /api/v1/credentials). Legacy setup
  removed per Phase 3.
pipeline: |
  agent: titan-worker-1
  stages:
    - stage: release
      steps:
        - sh: |
            echo "deploying with token=[$RELEASE_TOKEN]"
            echo "second use [$RELEASE_TOKEN] should also be masked"
            printenv | grep -E '^RELEASE_TOKEN=' || true
          env:
            RELEASE_TOKEN: ${{ secrets.E2E_REDACTION_TOKEN }}
expect:
  build: SUCCESS
  nodes:
    release: { status: SUCCESS }
  logContains:
    # The redaction marker must appear at least once — proves redaction fired,
    # vs. the secret simply not being printed.
    - '****'
  # logExcludes is intentionally EMPTY in this tombstone — it is NON-PROTECTIVE here.
  #
  # The real leak guard needs a *fresh per-run* structured sentinel
  # (`sentinel-redact-<hex>-canary`) so a trailing-suffix-after-newline leak still
  # trips `String.includes`. A static YAML scenario cannot mint or inject that
  # per-run value, so any literal here is either a stale hardcoded canary or — worse —
  # a bare prefix like 'sentinel-redact-' that would pass even if the *full* sentinel
  # leaked (the exclusion is trivially satisfied because nothing ever prints the bare
  # prefix). That false-green is exactly the regression this comment forbids.
  #
  # The protective version lives in e2e/specs/golden-path-secret-redaction.spec.ts,
  # which generates a per-run sentinel and asserts its absence across all 3 log
  # surfaces (SSE, persisted console, build-detail DOM). Do NOT re-add a literal here.
  logExcludes: []
