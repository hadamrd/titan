# #1213 sad-path fixture — fail_fast: true matrix throttled to maxParallel: 1.
# Only one cell runs at a time; when the first cell (linux/17) fails, the two
# remaining cells are still QUEUED behind the throttle. They must be ABORTED
# before they ever dispatch and the build must converge (no hung node).
titan:
  agent: linux
  failurePolicy: blockOnFailure

  env:
    CI: "true"
    REGISTRY: registry.example.com

  stages:
    - stage: Build
      matrix:
        axes:
          os: [linux, windows]
          jdk: [17, 21]
        exclude:
          - { os: windows, jdk: 17 }
        fail_fast: true
        maxParallel: 1
      steps:
        - sh: "build --os ${matrix.os} --jdk ${matrix.jdk}"
        - junit: { results: "target/surefire-reports/*.xml" }
        - archiveArtifacts: { artifacts: "target/app-${matrix.os}-${matrix.jdk}.jar" }

    - stage: Publish
      dependsOn: [Build]
      steps:
        - sh: "publish --registry $REGISTRY"
        - setOutput: { name: published, value: "true" }
