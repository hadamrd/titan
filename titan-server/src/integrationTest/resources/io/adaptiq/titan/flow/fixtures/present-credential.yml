# Titan pipeline test fixture — a single step whose credentials: binding names a
# credential id that IS in the credentials store. With no
# TITAN_CREDENTIAL_KEY configured, the orchestrator fails closed at dispatch with
# failure_category = CREDENTIAL and the TITAN_CREDENTIAL_KEY reason (design/45 §3,
# design/39 fail-closed).
titan:
  stages:
    - stage: Deploy
      steps:
        - sh: deploy.sh
          credentials:
            - id: deploy-token
              type: string
              variable: DEPLOY_TOKEN
