# Titan pipeline test fixture — a single step whose credentials: binding names a
# credential id that is NOT in the credentials store. The orchestrator
# fails the step at dispatch with failure_category = CREDENTIAL (design/45 §3).
titan:
  stages:
    - stage: Deploy
      steps:
        - sh: deploy.sh
          credentials:
            - id: e2e-ssh-key
              type: string
              variable: DEPLOY_TOKEN
