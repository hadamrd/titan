# ── Default test profile (unit tests: H2, no Docker) ────────────────────────
# Quarkus still boots the datasource/Flyway extension even when TitanStores is mocked,
# so we point it at an in-memory H2 to avoid needing a live Postgres for unit tests.
# OIDC is disabled by default so @QuarkusTest unit tests can use @TestSecurity instead
# of needing a live OIDC server. Dev Services for Keycloak re-enables it for KeycloakAuthIT.
quarkus.oidc.enabled=false

# GithubPrCommentReporter is OFF by default in tests — the reporter has its own
# WireMock-backed unit test (GithubPrCommentReporterTest) that builds the reporter
# directly with the flag injected to true. Leaving the global default at false
# keeps unrelated @QuarkusTest classes from spuriously trying to round-trip to a
# non-existent GitHub host.
titan.github.pr-comments.enabled=false

# Ephemeral test HTTP port — the default 8081 collides with the local rig's keycloak
# (and any concurrent worktree run). 0 = "OS picks a free port"; RestAssured discovers it
# via Quarkus' injected base URI, so test code does not need to know which port was chosen.
quarkus.http.test-port=0

quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:titan_quarkus_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=true;DEFAULT_NULL_ORDERING=HIGH

# Register H2's gen_random_uuid alias so Flyway migrations (which use it) work.
# H2 init script runs before Flyway.
quarkus.datasource.jdbc.initial-sql=CREATE ALIAS IF NOT EXISTS gen_random_uuid FOR "java.util.UUID.randomUUID"

# Flyway still runs migrations in test mode (creates the titan schema in H2).
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:io/adaptiq/titan/db/migration
quarkus.flyway.schemas=titan
quarkus.flyway.default-schema=titan
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# ── Dev Services for Keycloak (KeycloakAuthIT) ────────────────────────────────
# Quarkus owns the Keycloak container lifecycle — no hand-rolled Testcontainer.
# The realm file seeds the titan-test realm with Titan roles and test users.
# quarkus.oidc.auth-server-url is auto-injected by Dev Services; do NOT set it here.
quarkus.keycloak.devservices.realm-path=keycloak/test-realm.json
quarkus.keycloak.devservices.realm-name=titan-test
# Keycloak 26 first start with custom realm import can exceed the 60s default;
# raise the Dev Services container-startup timeout.
quarkus.devservices.timeout=180s

# ── postgres-it profile (ApiSurfaceIT: real Postgres via Testcontainers) ─────
# db-kind is a build-time property; setting it in the %postgres-it profile
# causes Quarkus to re-augment with the PostgreSQL driver for that test class.
# The actual URL/credentials are injected at runtime by PostgresTestResource.
%postgres-it.quarkus.datasource.db-kind=postgresql
%postgres-it.quarkus.datasource.username=titan
%postgres-it.quarkus.datasource.password=titan
%postgres-it.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/titan_placeholder
%postgres-it.quarkus.flyway.migrate-at-start=true
%postgres-it.quarkus.flyway.locations=classpath:io/adaptiq/titan/db/migration
%postgres-it.quarkus.flyway.schemas=titan
%postgres-it.quarkus.flyway.default-schema=titan
%postgres-it.quarkus.flyway.baseline-on-migrate=true
%postgres-it.quarkus.flyway.baseline-version=0
