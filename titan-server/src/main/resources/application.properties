# ── HTTP ──────────────────────────────────────────────────────────────────────
quarkus.http.port=8080

# ── Public URL ────────────────────────────────────────────────────────────────
# Externally-reachable base URL of this Titan rig — used by GithubStatusReporter
# (#835) when constructing target_url on commit-status POSTs back to GitHub so
# the PR-checks badge links back to /builds/{id} on the right host.
#
# Fail-closed in %prod (issue #935 — V1 bar 5 audit row 8): the base expression
# has NO fallback. A %dev override below supplies the localhost convenience URL
# so `task dev:titan` still boots without any env setup; %test gets the same
# default so unit tests don't have to thread the property everywhere. In %prod
# TITAN_PUBLIC_URL MUST be set by the operator — when unset, SmallRye Config
# refuses to resolve the property and Quarkus fails fast at boot, far better
# than silently emitting GitHub check-badge links pointing at localhost:8080.
titan.public-url=${TITAN_PUBLIC_URL}
%dev.titan.public-url=${TITAN_PUBLIC_URL:http://localhost:8080}
%test.titan.public-url=${TITAN_PUBLIC_URL:http://localhost:8080}

# ── GitHub PR-comment reporter (closes #966) ─────────────────────────────────
# When true, GithubPrCommentReporter posts (or edits in place) a single sticky
# Markdown comment on the PR for every terminal build transition, summarising
# pipeline + stages + duration + link to /builds/{id}. Dedupes via the marker
# "<!-- titan-build-comment -->". Disable per-rig by setting to false — the
# commit-status reporter (#835) is unaffected.
titan.github.pr-comments.enabled=${TITAN_GITHUB_PR_COMMENTS_ENABLED:true}

# ── GitHub Check-Runs (#965) ──────────────────────────────────────────────────
# When true (the default), GithubCheckRunReporter posts a richer Check-Run on
# start + completion for every App-triggered build, in addition to the legacy
# commit-status badge written by GithubStatusReporter. Flip false to disable —
# the column titan.builds.external_check_run_id stays unpopulated and the
# observer short-circuits with no HTTP traffic. Useful when running against a
# GitHub Enterprise instance that does not yet expose the checks API.
titan.github.check-runs.enabled=${TITAN_GITHUB_CHECK_RUNS_ENABLED:true}

# ── CORS (dev only — UI served same-origin via nginx in prod) ────────────────
# Quarkus dev mode runs UI on Vite :5173 hitting backend on :8080. Without this,
# every /api/* call is blocked by the browser. NOT %prod-scoped — prod nginx
# serves UI + reverse-proxies /api so there's no cross-origin call.
%dev.quarkus.http.cors=true
%dev.quarkus.http.cors.origins=http://localhost:5173,http://localhost:5180
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
%dev.quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
%dev.quarkus.http.cors.access-control-allow-credentials=true

# ── Manual-trigger rate limiter (closes #739) ─────────────────────────────────
# Per-(user_subject, job_id) token bucket guarding POST /api/v1/jobs/{id}/builds.
# Defaults match the issue contract: 5 burst, refill 1/min. Tune higher for power
# users / lower in shared dev rigs. Idle buckets are evicted after 1h (3600s).
titan.trigger.rate.burst=${TITAN_TRIGGER_RATE_BURST:5}
titan.trigger.rate.refill-per-min=${TITAN_TRIGGER_RATE_REFILL_PER_MIN:1}
titan.trigger.rate.idle-eviction-seconds=${TITAN_TRIGGER_RATE_IDLE_EVICTION_SECONDS:3600}

# Trust X-Forwarded-* headers when behind a reverse proxy / k8s ingress.
# Required so the OIDC redirect-uri the server hands to Keycloak carries the
# external scheme (https) + host (e.g. titan.example.com) the browser sees,
# rather than the in-cluster http://titan-server:8080 the pod hears. Limited
# to %prod — %dev / %test run the rig directly on localhost with no proxy.
#
# CONSTITUTION §2: this is the documented Quarkus way to handle ingress
# proxying — no custom filter, no header sniffing in app code.
%prod.quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.allow-forwarded=true
%prod.quarkus.http.proxy.enable-forwarded-host=true
%prod.quarkus.http.proxy.enable-forwarded-prefix=true

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=false
# Swagger UI only in dev/test profiles; set to true in application-dev.properties or via profile
%dev.quarkus.swagger-ui.always-include=true
%test.quarkus.swagger-ui.always-include=false

# ── Datasource (Agroal JDBC pool) ─────────────────────────────────────────────
# Bound to env vars; sane defaults for local dev only — NOT for production.
#
# Fail-closed in %prod (issue #932 — V1 bar 5): the JDBC URL has NO base default.
# A %dev override below supplies the localhost convenience URL so `task dev:titan`
# still boots without any env setup. In %prod and %test, TITAN_DB_URL MUST be
# set by the operator (the k3s + local rigs do this via ExternalSecret /
# docker-compose env). When unset, Quarkus refuses to boot with a clear
# "property quarkus.datasource.jdbc.url is required" message — far better than
# silently dialing localhost:5432 and timing out on a misconfigured pod.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${TITAN_DB_USER:titan}
quarkus.datasource.password=${TITAN_DB_PASSWORD:}
quarkus.datasource.jdbc.url=${TITAN_DB_URL}
%dev.quarkus.datasource.jdbc.url=${TITAN_DB_URL:jdbc:postgresql://localhost:5432/titan}
quarkus.datasource.jdbc.max-size=${TITAN_DB_POOL_SIZE:10}
quarkus.datasource.jdbc.min-size=2

# ── Flyway ────────────────────────────────────────────────────────────────────
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:io/adaptiq/titan/db/migration
quarkus.flyway.schemas=titan
quarkus.flyway.default-schema=titan
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
# Self-heal Flyway checksum drift on boot in production. Needed because V19
# (`task_archive_id_sequence`) was reshaped after PR #491 shipped to swap a
# PG-only `setval(...)` for the portable `ALTER SEQUENCE ... RESTART WITH`
# form (closes #501 — the original killed every @QuarkusTest H2 boot). The
# semantic outcome is identical; only the SQL text changed. `repair-at-start`
# rewrites the stored checksum on first boot after deploy and lets the
# unchanged migration history continue forward. Scoped to %prod — the
# %test/H2 datasource is in-memory and never has stale history.
%prod.quarkus.flyway.repair-at-start=true

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."io.adaptiq.titan".level=INFO

# Structured JSON console logger (quarkus-logging-json). Default-on so prod and
# unprofiled runs emit JSON-per-line for Loki / Datadog / Grafana Cloud ingest.
# Dev + test profiles override below to keep terminal output readable.
# Follow-up: #314 (OTLP exporter for traces+metrics+logs), #315 (worker-side logging).
quarkus.log.console.json=true
quarkus.log.console.json.pretty-print=false
quarkus.log.console.json.exception-output-type=detailed-and-formatted
quarkus.log.console.json.additional-field."service.name".value=titan-server
quarkus.log.console.json.additional-field."service.version".value=${quarkus.application.version}
%dev.quarkus.log.console.json=false
%test.quarkus.log.console.json=false

# ── OpenTelemetry (OTLP exporter) ─────────────────────────────────────────────
# Issue #314 — traces+metrics export gated on TITAN_OTEL_ENDPOINT. When the env
# var is unset (the default) Quarkus's OTel runtime is disabled and no exporter
# is configured — the server boots normally with zero OTel traffic. When set,
# Quarkus auto-discovers the OTLP exporter and pushes spans + metrics to that
# endpoint (e.g. http://otel-collector:4317 for gRPC, http://…:4318/v1/traces
# for HTTP). Worker-side propagation reads the W3C traceparent stamped onto
# task_queue rows (#315 picks this up).
quarkus.otel.enabled=${TITAN_OTEL_ENABLED:false}
quarkus.otel.exporter.otlp.endpoint=${TITAN_OTEL_ENDPOINT:}
quarkus.otel.service.name=titan-server
# Tests must never attempt to export — Dev Services / unit suites have no
# collector and a botched export pollutes logs.
%test.quarkus.otel.enabled=false
%test.quarkus.otel.sdk.disabled=true

# ── Micrometer / Prometheus (#649) ────────────────────────────────────────────
# Exposes Titan-native + Quarkus stock meters at /q/metrics in Prometheus
# text-format. Default ON in all profiles; flip the toggle to disable scraping
# for an isolated rig. CONSTITUTION §6: status / action labels are bounded —
# no plaintext secret ever enters a label.
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
# Tests do not need stock JVM/HTTP meters churning — keep the registry slim.
%test.quarkus.micrometer.binder.jvm=false
%test.quarkus.micrometer.binder.system=false

# ── Health ────────────────────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.liveness-path=/q/health/live
quarkus.smallrye-health.readiness-path=/q/health/ready

# ── Banner ────────────────────────────────────────────────────────────────────
quarkus.banner.enabled=false

# ── Webhook receiver ──────────────────────────────────────────────────────────
# The canonical GitHub webhook receiver lives at POST /api/v1/triggers/github
# (GithubWebhookApi) and authenticates per-trigger with credentials stored on
# each job. The legacy /api/v1/webhooks/github path is a 308 redirect shim
# scheduled for removal — see docs/design/52-webhook-endpoint-dedupe.md and
# issue #970. The previous global TITAN_WEBHOOK_SECRET is no longer consulted.

# ── OIDC (quarkus-oidc bearer-token service) ──────────────────────────────────
# auth-server-url is intentionally NOT set at the default scope: in %test the test
# profile re-enables OIDC for KeycloakAuthIT and Dev Services for Keycloak injects
# the URL at runtime (this only happens when the property is unset). %prod and %dev
# get the issuer from TITAN_OIDC_ISSUER, with a localhost default for dev convenience.
quarkus.oidc.client-id=${TITAN_OIDC_CLIENT_ID:titan-server}
quarkus.oidc.credentials.secret=${TITAN_OIDC_CLIENT_SECRET:}
quarkus.oidc.application-type=service
quarkus.oidc.token.audience=${TITAN_OIDC_AUDIENCE:titan-server}

# ── UI runtime config (closes #898) ───────────────────────────────────────────
# Consumed ONLY by GET /api/v1/system/ui-config — the boot endpoint the SPA hits
# before instantiating UserManager so a single rig-agnostic bundle can target any
# titan-server. NEVER inject these into the JS at build time (that was #898).
#
# - titan.ui.oidc-client-id: the PUBLIC SPA client in Keycloak. Distinct from
#   quarkus.oidc.client-id (the server-side bearer-token *service* client). Default
#   "titan-ui" matches the realm import shipped with the local rig.
# - titan.ui.oidc-authority: the OIDC issuer URL the BROWSER must reach. Only set
#   when it differs from quarkus.oidc.auth-server-url (e.g. in-cluster k8s service
#   DNS for server-side validation vs. public ingress for the SPA). When unset,
#   the ui-config endpoint falls back to quarkus.oidc.auth-server-url.
titan.ui.oidc-client-id=${TITAN_UI_OIDC_CLIENT_ID:titan-ui}
titan.ui.oidc-authority=${TITAN_UI_OIDC_AUTHORITY:}

# ── SCM discovery scheduler (closes #275) ─────────────────────────────────────
# Cadence of the DiscoveryScheduler @Scheduled tick. The poller walks every
# enabled job that declares an `scm` block in its config_json, resolves the
# remote HEAD SHA, and triggers a build when it differs from the last seen
# SHA. Set to "off" / "disabled" via Quarkus scheduler config to silence.
quarkus.scheduler.titan.discovery.every=${TITAN_DISCOVERY_EVERY:1m}

# ── Agent lifecycle reaper (closes #719) ──────────────────────────────────────
# Drives AgentLifecycle emissions: backfills JOINED for newly-seen agents
# (dedup-window protected) and flips stale ONLINE agents to OFFLINE while
# emitting a LEFT event. Workers write titan.agents directly via JDBC, so this
# scheduler is the controller-side seam that observes those writes.
quarkus.scheduler.titan.agent-reaper.every=${TITAN_AGENT_REAPER_EVERY:30s}
titan.agent-reaper.stale-seconds=${TITAN_AGENT_REAPER_STALE_SECONDS:90}

%prod.quarkus.oidc.auth-server-url=${TITAN_OIDC_ISSUER}
%dev.quarkus.oidc.auth-server-url=${TITAN_OIDC_ISSUER:http://localhost:8180/realms/titan}

# ── Quarkus Cache (Caffeine) ─────────────────────────────────────────────────
# Three hot-path caches — see io.adaptiq.titan.cache for the load/invalidate wiring.
#
# 1) pipeline-model — parsed PipelineModel keyed by buildId. Loaded every orchestrator
#    tick from titan.builds.pipeline_model_json + Jackson parse; invalidated when a
#    build transitions to terminal (SUCCESS/FAILED/ABORTED/UNSTABLE), is deleted, or
#    is updated through BuildService.update(...).
quarkus.cache.caffeine."pipeline-model".initial-capacity=50
quarkus.cache.caffeine."pipeline-model".maximum-size=500
quarkus.cache.caffeine."pipeline-model".expire-after-write=30M
#
# 2) job-lookup — JobService.findById result keyed by jobId. TTL is 10s — short enough
#    that staleness is not observable across a tick burst, long enough to amortise the
#    DB round-trip the trigger / orchestrator paths make repeatedly. Invalidated on
#    JobService.update(...) and JobService.delete(...).
quarkus.cache.caffeine."job-lookup".initial-capacity=200
quarkus.cache.caffeine."job-lookup".maximum-size=2000
quarkus.cache.caffeine."job-lookup".expire-after-write=10S
#
# 3) cron-compile — compiled CronSchedule keyed by the cron expression. Config-only
#    in this PR — the Wave 1 trigger framework (feat/port-trigger-framework) will add
#    the @CacheResult annotation on CronSchedule.compile(String) when it lands.
quarkus.cache.caffeine."cron-compile".initial-capacity=100
quarkus.cache.caffeine."cron-compile".maximum-size=1000
quarkus.cache.caffeine."cron-compile".expire-after-write=1H
