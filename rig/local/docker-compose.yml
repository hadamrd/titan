# Titan local rig — standalone.
#
# Brings up the full Titan product stack on a single docker network:
#
#   postgres        - the Titan engine database (Flyway runs on titan-server boot)
#   keycloak        - OIDC issuer, pre-seeded with the `titan-dev` realm + dev user
#   titan-server    - Quarkus HTTP API + Titan engine
#   titan-ui        - the React SPA (Vite build, served by nginx, proxies /api → titan-server)
#   titan-worker    - the pull-based execution agent (claims tasks from titan.task_queue)
#
# Bring up:    task dev:titan
# Tear down:   task dev:down       (-v wipes all volumes — fresh start)
# Tail logs:   task dev:logs

services:

  # ── Postgres ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "titan"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-titan-dev-only}"
      POSTGRES_DB: "titan"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [titan]

  # ── Keycloak (OIDC issuer) ────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_HEALTH_ENABLED: "true"
      # Host the SPA sees as the issuer. Tokens are issued with this URL in
      # the `iss` claim — must match what the browser uses for verification.
      KC_HOSTNAME_URL: "http://localhost:8081"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_RELATIVE_PATH: "/"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-titan-dev.json:/opt/keycloak/data/import/realm-titan-dev.json:ro
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      # Realm-discovery probe via the public port — that is what the SPA + the
      # titan-server actually hit, so a green probe means OIDC is usable.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/titan-dev/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped
    networks: [titan]

  # ── Titan server (Quarkus) ────────────────────────────────────────────────
  titan-server:
    build:
      context: ../..
      dockerfile: rig/local/Dockerfile.titan-server
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # Postgres — Flyway migrates on boot.
      TITAN_DB_URL: "jdbc:postgresql://postgres:5432/titan"
      TITAN_DB_USER: "titan"
      TITAN_DB_PASSWORD: "${POSTGRES_PASSWORD:-titan-dev-only}"
      # OIDC. Dual-network reality:
      #   • Discovery happens inside docker → keycloak:8080
      #   • The SPA logs in via the host → localhost:8081, so JWTs carry
      #     iss = http://localhost:8081/realms/titan-dev
      # Override the expected-issuer claim so titan-server accepts the
      # browser-issued tokens it actually sees (Quarkus OIDC supports this).
      TITAN_OIDC_ISSUER: "http://keycloak:8080/realms/titan-dev"
      QUARKUS_OIDC_TOKEN_ISSUER: "http://localhost:8081/realms/titan-dev"
      TITAN_OIDC_CLIENT_ID: "titan-server"
      TITAN_OIDC_AUDIENCE: "titan-server"
      # Browser-facing OIDC bootstrap served by GET /api/v1/system/ui-config
      # (issue #38). Without these the SPA is told to fetch OIDC metadata from
      # the docker-internal keycloak:8080 (unreachable from the host, blocked
      # by the UI's CSP connect-src) and to redirect back to the SERVER origin
      # :18080 — while the realm seed allowlists exactly
      # http://localhost:5180/* for the titan-ui client. Login dies on the
      # first click.
      #   • TITAN_UI_OIDC_AUTHORITY — the issuer URL the BROWSER reaches
      #     (host-published keycloak port; matches QUARKUS_OIDC_TOKEN_ISSUER).
      #   • TITAN_UI_PUBLIC_URL — the SPA origin; drives oidc.redirectUri /
      #     postLogoutRedirectUri ONLY. TITAN_PUBLIC_URL below stays the
      #     server origin for webhook/SCM-link consumers.
      TITAN_UI_OIDC_AUTHORITY: "http://localhost:8081/realms/titan-dev"
      TITAN_UI_PUBLIC_URL: "http://localhost:5180"
      # Required by %prod since #996 — no silent localhost fallback. The local
      # rig serves titan-server via the host port 18080 (see ports: below); the
      # public URL is what GitHub webhooks / SCM Check-Runs use as their base
      # for callback links. For a laptop rig with no public ingress this is
      # cosmetic, but it must be set or boot fails (#1048).
      TITAN_PUBLIC_URL: "${TITAN_PUBLIC_URL:-http://localhost:18080}"
      # Keycloak admin REST API service account (#608). Used by
      # titan-server/KeycloakAdminClient to back GET /api/v1/admin/users with
      # real Keycloak data instead of the STUB user list (#607). The
      # `titan-admin-cli` client is seeded in realm-titan-dev.json with
      # serviceAccountsEnabled + realm-management/view-users + view-realm.
      #
      # DEV ONLY: this secret matches the fixture in the realm JSON. Production
      # deployments inject these via a k8s Secret backed by Infisical (per
      # CONSTITUTION §6 — no real secrets in git).
      TITAN_KC_ADMIN_CLIENT_ID: "titan-admin-cli"
      TITAN_KC_ADMIN_CLIENT_SECRET: "titan-admin-dev-secret-CHANGE-IN-PROD"
      # Credential envelope key (KEK) — DEV ONLY auto-generation (closes #800).
      #
      # The local rig has no KMS / Infisical wired up. Two env vars together
      # activate DevAutoKeyProvider:
      #
      #   • TITAN_PROFILE=dev  — required since #1076 (V1-bar #5). The
      #     DevAutoKeyProvider constructor refuses in any other profile, so
      #     this is the load-bearing fail-closed gate. Note that QUARKUS_PROFILE
      #     stays `prod` so Quarkus' own production-mode behaviour applies; the
      #     two profile signals are intentionally independent.
      #   • LOOP_TITAN_ALLOW_DEV_KEK=1  — explicit opt-in within dev
      #     (replaces TITAN_CREDENTIALS_DEV_AUTO_KEK, which is still accepted
      #     for back-compat). With dev profile and this flag set, the provider
      #     on first boot generates a random AES-256 key, persists it to
      #     TITAN_DEV_KEK_PATH (mode 0600), and reuses it on subsequent boots
      #     so `dev:down && dev:titan` does not brick previously-encrypted rows.
      #     The titan-server-secrets volume below survives `dev:down`;
      #     use `dev:down -v` (volume wipe) to deliberately reset the KEK.
      #
      # PRODUCTION: leave TITAN_PROFILE unset (or set to `prod`) and ship the
      # titan-keyprovider-infisical jar (or another KMS-backed provider) on
      # the classpath. With no dev profile, titan-server now fails-fast at
      # boot if no real KEK provider is wired (see
      # docs/ops/runbooks/kek-config.md). The earlier behaviour (HTTP 500 on
      # the first credential write) was upgraded to a startup abort in #1076.
      TITAN_PROFILE: "${TITAN_PROFILE:-dev}"
      LOOP_TITAN_ALLOW_DEV_KEK: "${LOOP_TITAN_ALLOW_DEV_KEK:-1}"
      TITAN_CREDENTIALS_DEV_AUTO_KEK: "${TITAN_CREDENTIALS_DEV_AUTO_KEK:-true}"
      TITAN_DEV_KEK_PATH: "/var/titan/secrets/dev-kek"
      TITAN_SECRETS_BACKEND: "db-envelope"
      QUARKUS_PROFILE: "prod"
      # Artifact store — must mirror the worker (#854 / #862). PR #857 routes
      # the signed-URL artifact download through titan-server, so the server
      # reads the bytes the worker wrote on the shared `titan-ws` volume. If
      # these are only set on the worker (the #854 gap) the server returns
      # 503 "no artifact store is configured" on every Preview/Get click.
      TITAN_ARTIFACT_STORE: "fs"
      TITAN_ARTIFACT_ROOT: "/titan/artifacts"
      # Local-dev CORS — allow a Vite-served UI on :5173 / :5180 to call the
      # docker-rig titan-server on :18080 cross-origin (closes #862). PR #843
      # set this only in the %dev Quarkus profile, but the rig runs in `prod`,
      # so the dev-profile config never applies. Explicit env vars are
      # profile-agnostic. Prod rigs don't need this (nginx serves the UI
      # same-origin).
      QUARKUS_HTTP_CORS: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:5173,http://localhost:5180"
      QUARKUS_HTTP_CORS_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      QUARKUS_HTTP_CORS_HEADERS: "accept,authorization,content-type,x-requested-with"
      QUARKUS_HTTP_CORS_EXPOSED_HEADERS: "content-disposition,content-length"
    ports:
      # Internal network address stays 8080 (titan-server:8080). On the host
      # we publish on 18080 to dodge collisions with other local JVMs that
      # commonly grab :8080 (Spring Boot, dev maven-exec, etc.).
      - "127.0.0.1:18080:8080"
    volumes:
      - titan-server-secrets:/var/titan/secrets
      # Shared workspace with the worker — the worker writes archived
      # artifacts under /titan/artifacts (fs backend), and titan-server reads
      # them back to serve signed-URL downloads (PR #857 / #862).
      - titan-ws:/titan
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/q/health/ready || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks: [titan]

  # ── Titan UI (React SPA, served by nginx) ─────────────────────────────────
  # Post-#898: no VITE_* build-args — runtime config comes from titan-server's
  # GET /api/v1/system/ui-config. One image deploys to any rig.
  titan-ui:
    build:
      context: ../..
      dockerfile: rig/local/Dockerfile.titan-ui
    depends_on:
      titan-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:5180:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [titan]

  # ── Titan worker (pull-based execution agent) ─────────────────────────────
  titan-worker:
    build:
      context: ../..
      dockerfile: rig/local/Dockerfile.titan-worker
    depends_on:
      postgres:
        condition: service_healthy
      titan-server:
        condition: service_healthy
    environment:
      TITAN_DB_URL: "jdbc:postgresql://postgres:5432/titan"
      TITAN_DB_USER: "titan"
      TITAN_DB_PASSWORD: "${POSTGRES_PASSWORD:-titan-dev-only}"
      TITAN_AGENT_ID: "local-worker-01"
      # Subscribe to the queue the orchestrator emits EXECUTE_COMMAND tasks
      # onto when a pipeline declares no `agent:` label. StepDispatcher falls
      # back to "default" (see titan-server StepDispatcher.dispatchStepTask).
      # Mismatching this with what the orchestrator emits leaves real builds
      # forever-QUEUED on the rig (loop tick #67). Follow-up: make the
      # orchestrator queue-label-aware so multi-worker rigs can coexist.
      TITAN_QUEUE: "default"
      TITAN_AGENT_NAME: "Local Worker 01"
      TITAN_LABELS: "docker,linux,amd64"
      # Executor capacity sized for the golden e2e suite's known concurrent
      # load (GH #74): Playwright runs with 2 workers, so a container-heavy
      # fixture build (spec-24's 23-node fullstack pipeline runs 2 lint steps
      # in parallel for ~90s) overlaps with approval/burst micro-builds AND
      # worker-synthesis tasks — which all compete for the same executor
      # slots. With 2 executors one fullstack build saturated the worker and
      # starved 25-approval-flow's 30/60s budgets. 4 = 2 (one saturating
      # fixture build) + 1 (concurrent micro-build step) + 1 (synthesis /
      # burst headroom) — fits a laptop; raise via a compose override if you
      # run more PW workers.
      TITAN_EXECUTORS: "4"
      TITAN_REMOTE_FS: "/titan"
      TITAN_MODE: "NORMAL"
      # Local rig: explicit TITAN_WORKSPACE + TITAN_DEV_MODE=true lets the
      # worker fall back to ${java.io.tmpdir}/titan-libraries for the shared
      # libraries cache. In production both TITAN_WORKSPACE and
      # TITAN_LIBRARIES_ROOT must be set explicitly (audit #10 / #936) — the
      # worker refuses to boot when TITAN_DEV_MODE is not true and either is
      # missing.
      TITAN_DEV_MODE: "true"
      TITAN_WORKSPACE: "/titan/worker"
      # Docker-out-of-docker bind-mount translation (#1246). The worker starts `image:` stages
      # through the shared HOST daemon socket; that daemon resolves a bind SOURCE against the HOST
      # filesystem, not the worker container's. /titan/worker is a named-volume mount that does not
      # exist on the host, so without this the stage gets an EMPTY /workspace and every container
      # build fails (maven: pom.xml not found). This maps /titan/worker to the host path that backs
      # the `local_titan-ws` volume so the stage sees the real checked-out tree. Override
      # TITAN_WS_HOST_ROOT if your compose project name (volume prefix) differs from `local`.
      TITAN_WORKSPACE_HOST_ROOT: "${TITAN_WS_HOST_ROOT:-/var/lib/docker/volumes/local_titan-ws/_data/worker}"
      TITAN_POLL_MS: "1000"
      TITAN_HEARTBEAT_MS: "10000"
      # Artifact store — DEV ONLY filesystem backend (closes #848).
      #
      # The `fs` backend writes archived artifacts to a local directory under the
      # shared `titan-ws` volume, so the rig boots with `archiveArtifacts` working
      # out of the box. Without these two vars set, the worker falls back to
      # ArtifactSink.UNCONFIGURED and any `archiveArtifacts` step fails the build
      # with "no artifact store is configured for this worker" — the bug that
      # tripped the dogfood-fire smoke run on the simple-build fixture.
      #
      # PRODUCTION: leave these unset (or set TITAN_ARTIFACT_STORE=s3 / =nexus and
      # supply the backend-specific TITAN_ARTIFACT_* vars). The fs backend is fine
      # for a single-node dev rig but does not survive a worker pod rescheduling
      # and offers no durability guarantees. The k3s rig wires S3/R2 explicitly.
      TITAN_ARTIFACT_STORE: "fs"
      TITAN_ARTIFACT_ROOT: "/titan/artifacts"
    volumes:
      - titan-ws:/titan
      # Vendored e2e fixture sources (GH #73). The legacy golden-path fixtures
      # (e2e/pipelines/*/titan-pipeline.yml) cd into /titan/fixtures/<name> —
      # their specs document that "the fixture source is mounted into the
      # worker workspace by the rig's docker-compose", and the failure-triage
      # spec (#1130 test 4) patches a fixture file ON THE HOST and expects the
      # next build to pick the change up, so this must be a live bind mount,
      # not a copy. Mounted rw: npm writes node_modules/ into the fixture dirs
      # (gitignored), which is what keeps `npm install` a no-op after the
      # first build and the triage spec inside its 30s FAILURE budget.
      - ../../e2e/pipelines:/titan/fixtures
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks: [titan]

volumes:
  postgres-data:
  keycloak-data:
  titan-server-secrets:
  titan-ws:

networks:
  titan:
    driver: bridge
