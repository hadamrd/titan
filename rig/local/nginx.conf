# nginx config for the titan-ui container.
#
# - Serves the Vite-built SPA from /usr/share/nginx/html.
# - Reverse-proxies /api/ and /q/ (Quarkus health/openapi) to titan-server.
# - Falls back to /index.html for any unknown path so client-side routing
#   (TanStack Router) survives a browser refresh / deep link.
#
# Cache contract (#1207) — the SPA is served with two distinct cache policies:
#
#   - index.html (and the SPA deep-link fallback) → `no-store`. This was
#     ALREADY correct before #1207 and is left unchanged: a real user
#     hard-loading the page always re-fetches the document and therefore
#     always gets the *current* hashed `<script src>`. (The "stale bundle"
#     once seen on 2026-06-04 was a Playwright browser-context artifact — the
#     SPA stayed mounted across a screenshot session and an in-app hash
#     navigation never hard-reloaded the document — NOT a user-facing defect.
#     See issue #1207's correction comment.)
#   - /assets/* (content-addressed — Vite puts the content hash in the
#     filename) → `public, max-age=31536000, immutable`. THIS is the real fix
#     of #1207: the old blanket `no-store` forced a full JS/CSS re-download on
#     every navigation. The hashed URL never changes content, so cache it for
#     a year. (A perf/bandwidth nit, not a correctness bug.)
#
# ⚠️ nginx `add_header` does NOT inherit into a nested `location` block: if a
# location declares ANY add_header, it loses ALL add_headers from the enclosing
# scope. So the security headers (CSP / X-Content-Type-Options / Referrer-Policy)
# are re-declared in EVERY location that serves a response. (CSP is intentionally
# omitted from /assets/ — it is a no-op on non-HTML responses; see that block.)
#
# CSP: locked-down enough to be informative but permissive enough for OIDC
# (login redirects to keycloak on :8081) + SSE (build logs stream over /api).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── /api/ → titan-server ────────────────────────────────────────────
    location /api/ {
        proxy_pass http://titan-server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE — build-log streaming.
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     1h;
        proxy_send_timeout     1h;
    }

    # ── /q/ → titan-server (Quarkus health, openapi, etc.) ──────────────
    location /q/ {
        proxy_pass http://titan-server:8080/q/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── hashed, content-addressed assets → cache forever ────────────────
    # Vite emits /assets/<name>-<hash>.{js,css,…}; the hash changes whenever
    # the content changes, so the URL is safe to cache immutably. A request
    # for a hash that no longer exists 404s (=404) rather than falling back to
    # index.html — serving HTML under a .js URL would be a hard error, and a
    # stale-hash 404 is the correct signal that the client is on an old bundle.
    location /assets/ {
        try_files $uri =404;
        # NOTE: no `always` flag — Cache-Control must apply to 2xx/3xx only.
        # A transient 404 for a stale hash (the window between a deploy and a
        # user's next full reload) must NOT be marked immutable, or browsers /
        # any future CDN would cache the error for a year.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # `immutable` means the browser never revalidates, so an ETag would be
        # dead weight (wasted bytes on every 200). Drop it.
        etag off;
        # Security headers re-declared (add_header does not inherit — see note
        # above). These are `always` so they also cover the 404 error response.
        # CSP is deliberately NOT set here: it only governs HTML document
        # contexts, so it is a no-op on application/javascript|text/css
        # responses. Do NOT "sync" it in from the HTML locations — that would
        # be pointless clutter.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # ── SPA + index.html → no-store ─────────────────────────────────────
    # Serves a direct GET /index.html, the SPA deep-link fallback target of
    # `try_files … /index.html`, and any other root-level static file
    # (favicon.ico, etc.). `no-store` keeps the document uncached so a real
    # user always re-fetches the current hashed `<script src>` — unchanged
    # from before #1207 (see the cache-contract note at the top of this file).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        # CSP — kept narrow but allow keycloak (8081) for OIDC + the API
        # origin (same host, default port) for fetch + SSE.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://avatars.githubusercontent.com; connect-src 'self' http://localhost:8081 http://localhost:8080 https://*.example.com; frame-src 'self' http://localhost:8081 https://*.example.com; form-action 'self' http://localhost:8081 https://*.example.com https://github.com; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
