{{- /*
PVC backing the registry's blob store. local-path (k3s default) gives us
node-local fast disk; the trade-off is single-node — when we outgrow it we
migrate to RBD or swap to S3-backed storage. See the runbook
docs/ops/runbooks/in-cluster-registry.md for the procedure.
*/ -}}
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: titan-registry-data
  labels:
    {{- include "titan-registry.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | default "ReadWriteOnce" }}
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
