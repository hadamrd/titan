{{- /*
ExternalSecret: pull the htpasswd file body from Infisical and materialise it
into a k8s Secret the Deployment mounts. Mirrors the pattern used by the
adaptiq namespace's adaptiq-secrets ExternalSecret (External-Secrets Operator
is already running on the cluster).

The remote Infisical key is `REGISTRY_HTPASSWD` (matches the existing entries
in staging/dev/prod env). The materialised Secret has a single key — the
htpasswd file body. The Deployment mounts that key as /auth/htpasswd.

Set externalSecret.enabled=false if you provision the Secret yourself.
*/ -}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "titan-registry.authSecretName" . }}
  labels:
    {{- include "titan-registry.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStore.kind }}
    name: {{ .Values.externalSecret.secretStore.name }}
  target:
    name: {{ include "titan-registry.authSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.auth.secretKey }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
{{- end }}
