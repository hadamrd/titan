{{- /*
ExternalSecret: sync the postgres `titan` user password from Infisical and
materialise it (plus the other chart secrets) into `titan-secrets`, the ONE
Secret every other manifest references via secretKeyRef.

Why this exists (#1160): postgres only honours POSTGRES_PASSWORD on the FIRST
init of an empty data dir. On a PVC-backed StatefulSet the live password is
frozen at first boot, while a chart-literal `CHANGE-ME` placeholder in
`titan-secrets` silently drifts on the next `helm upgrade` — titan-server then
crash-loops with `password authentication failed for user "titan"`. Sourcing
the password from Infisical makes postgres init and titan-server read the SAME
value, STABLE across upgrades (ESO re-syncs the same remote value; it is never
regenerated).

Ownership: when enabled, this ExternalSecret is the SOLE owner of
`titan-secrets` (creationPolicy: Owner). The plaintext Secret template
(secrets.yaml) is gated OFF in the same case — `titan.plaintextSecretEnabled` in
_helpers.tpl returns false when externalSecret.enabled=true, auto-suppressing the
plaintext Secret (silent suppression, not a fail) so there are never two owners.

Scope (per #1160): ONLY POSTGRES_PASSWORD comes from Infisical. TITAN_KEK,
KEYCLOAK_ADMIN_PASSWORD and the optional S3 artifact creds stay on the existing
values path — they are injected here as literals via target.template.data, NOT
re-sourced from Infisical. Key names are unchanged so existing secretKeyRefs
keep working.

The inner `{{ "{{ .postgresPassword }}" }}` is escaped from Helm so the literal
`{{ .postgresPassword }}` reaches ESO's own template engine, which substitutes
the value fetched under secretKey `postgresPassword`.
*/ -}}
{{- if .Values.secrets.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "titan.secretName" . }}
  labels:
    {{- include "titan.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.secrets.externalSecret.secretStore.kind }}
    name: {{ .Values.secrets.externalSecret.secretStore.name }}
  target:
    name: {{ include "titan.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # Sourced from Infisical (the whole point of this ticket).
        POSTGRES_PASSWORD: {{ printf "{{ .postgresPassword }}" | quote }}
        # Left on the existing values path — NOT re-sourced from Infisical (#1160 out-of-scope).
        TITAN_KEK: {{ .Values.secrets.titanKek | quote }}
        KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.keycloakAdminPassword | quote }}
        {{- if eq .Values.titanServer.artifacts.backend "s3" }}
        ARTIFACTS_ACCESS_KEY: {{ .Values.secrets.artifactsAccessKey | quote }}
        ARTIFACTS_SECRET_KEY: {{ .Values.secrets.artifactsSecretKey | quote }}
        {{- end }}
        {{- if eq (include "titan.infisicalEnabled" .) "true" }}
        # Injected as a literal (NOT re-sourced from Infisical — the token is
        # what authenticates TO Infisical, so it cannot come from it). Supply via
        # `--set secrets.infisicalToken=...` at deploy time; keep it out of git.
        INFISICAL_TOKEN: {{ .Values.secrets.infisicalToken | quote }}
        {{- end }}
  data:
    - secretKey: postgresPassword
      remoteRef:
        key: {{ .Values.secrets.externalSecret.remoteKey }}
{{- end }}
