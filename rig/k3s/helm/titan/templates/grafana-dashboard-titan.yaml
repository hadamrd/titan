{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Starter Grafana dashboard for the titan_* metrics exposed by titan-server
# at /q/metrics (see PR #652 for the series, PR #656 for the scrape config).
#
# Picked up automatically by the kube-prometheus-stack Grafana sidecar, which
# watches ConfigMaps with `grafana_dashboard=1` cluster-wide and provisions
# them under the folder named in the `grafana_folder` annotation.
#
# Keep the JSON minimal. SREs iterate on the live Grafana and PR refinements
# back into this file.
apiVersion: v1
kind: ConfigMap
metadata:
  name: titan-overview-dashboard
  labels:
    {{- include "titan.labels" . | nindent 4 }}
    grafana_dashboard: "1"
    {{- with .Values.monitoring.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    grafana_folder: {{ .Values.monitoring.grafanaDashboard.folder | quote }}
data:
  titan-overview.json: |
    {
      "title": "Titan — Overview",
      "uid": "titan-overview",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "",
      "tags": ["titan", "ci"],
      "time": {"from": "now-1h", "to": "now"},
      "refresh": "30s",
      "templating": {"list": []},
      "annotations": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Build start rate by status",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (status) (rate(titan_builds_started_total[5m]))",
              "legendFormat": "{{`{{status}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Build finish rate by status",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (status) (rate(titan_builds_finished_total[5m]))",
              "legendFormat": "{{`{{status}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Queue depth",
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "titan_queue_depth", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 10},
                  {"color": "red", "value": 50}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Workers online",
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "titan_workers_online", "refId": "A"}
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 1}
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Audit event rate by type",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {
              "expr": "sum by (type) (rate(titan_audit_events_total[5m]))",
              "legendFormat": "{{`{{type}}`}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}}
        }
      ]
    }
{{- end }}
