{{- if .Values.monitoring.serviceMonitor.enabled }}
# Rendered only when the cluster has kube-prometheus-stack (or another
# operator that ships the monitoring.coreos.com/v1 ServiceMonitor CRD).
# Without that CRD installed, leave monitoring.serviceMonitor.enabled=false
# and rely on the scrape annotations on the Service/Pod template (vanilla
# Prometheus discovery via `kubernetes_sd_configs`).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: titan-server
  labels:
    {{- include "titan.labels" . | nindent 4 }}
    app: titan-server
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: titan-server
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /q/metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
