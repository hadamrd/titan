{{- /*
The one Secret every other manifest references. Created only when
secrets.create=true AND secrets.externalSecret.enabled=false — if you sync
secrets from an external store (Infisical/Vault/SOPS), enable the
ExternalSecret (externalsecret.yaml) instead, which becomes the SOLE owner of
this Secret. The two are MUTUALLY EXCLUSIVE: `titan.plaintextSecretEnabled`
returns false when externalSecret.enabled=true, suppressing this template so a
k8s Secret only ever has one owner (silent suppression, not a fail — #1160).
*/ -}}
{{- if eq (include "titan.plaintextSecretEnabled" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "titan.secretName" . }}
  labels:
    {{- include "titan.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  TITAN_KEK: {{ .Values.secrets.titanKek | quote }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.secrets.keycloakAdminPassword | quote }}
  {{- if eq .Values.titanServer.artifacts.backend "s3" }}
  ARTIFACTS_ACCESS_KEY: {{ .Values.secrets.artifactsAccessKey | quote }}
  ARTIFACTS_SECRET_KEY: {{ .Values.secrets.artifactsSecretKey | quote }}
  {{- end }}
  {{- if eq (include "titan.infisicalEnabled" .) "true" }}
  # Rendered only when the server/worker resolve credentials via Infisical.
  # Supply the value out-of-band (`--set secrets.infisicalToken=...`) — keep it
  # empty in any committed values file so the token is never in git.
  INFISICAL_TOKEN: {{ .Values.secrets.infisicalToken | quote }}
  {{- end }}
{{- end }}
